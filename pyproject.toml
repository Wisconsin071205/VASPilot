[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vaspilot"
# single source of truth: src/vaspilot/__init__.py
dynamic = ["version"]
description = "CLI-first, multi-model VASP/HPC agent with restricted, auditable remote operations"
requires-python = ">=3.11"
license = { text = "Proprietary (research prototype)" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Windows-only native window over the local web console (`vaspilot desktop`).
desktop = ["pywebview>=6,<7"]

[project.scripts]
vaspilot = "vaspilot.cli.main:main"
huwei = "vaspilot.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "vaspilot.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vaspilot.gateway" = ["codex_bridge.mjs"]
"vaspilot.desktop" = ["assets/*.ico", "assets/*.icns"]

[tool.pytest.ini_options]
# Tests must exercise this checkout even when another VASPilot install exists.
pythonpath = ["src"]
testpaths = ["tests"]
