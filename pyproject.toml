[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rsci"
# The release version is defined once in the Python package.
dynamic = ["version"]
description = "CLI-first, multi-model VASP/HPC agent with restricted, auditable remote operations"
requires-python = ">=3.11"
license = { text = "Proprietary (research prototype)" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
desktop = ["pywebview>=6,<7"]
materials = ["pymatgen", "custodian", "atomate2"]
dispatch = ["dpdispatcher"]
provenance = ["aiida-core"]
automation = ["pymatgen", "custodian", "atomate2", "dpdispatcher", "aiida-core"]

[project.scripts]
rsci = "rsci.cli.main:main"
huwei = "rsci.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "rsci.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rsci.providers" = ["codex_bridge.mjs"]
"rsci.ui" = ["static/*.html"]
"rsci.desktop" = ["assets/*.ico", "assets/*.icns"]

[tool.pytest.ini_options]
# Tests must exercise this checkout even when another rsci install exists.
pythonpath = ["src"]
testpaths = ["tests"]
