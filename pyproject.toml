[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vasploom"
version = "1.5.0"
description = "CLI-first, multi-model VASP/HPC agent with restricted, auditable remote operations"
requires-python = ">=3.11"
license = { text = "Proprietary (research prototype)" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
materials = ["pymatgen", "custodian", "atomate2"]
dispatch = ["dpdispatcher"]
provenance = ["aiida-core"]
automation = ["pymatgen", "custodian", "atomate2", "dpdispatcher", "aiida-core"]

[project.scripts]
vasploom = "vasploom.cli.main:main"
huwei = "vasploom.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vasploom.providers" = ["codex_bridge.mjs"]
"vasploom.ui" = ["static/*.html"]

[tool.pytest.ini_options]
# Tests must exercise this checkout even when another VaspLoom install exists.
pythonpath = ["src"]
testpaths = ["tests"]
