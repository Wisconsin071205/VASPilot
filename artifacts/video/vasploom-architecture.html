<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VaspLoom 架构动画</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; min-height: 100%; background: #07111d; }
    body { display: grid; place-items: center; overflow: hidden; font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
    .stage { width: min(100vw, 177.7778vh); aspect-ratio: 16 / 9; position: relative; overflow: hidden; }
    svg { display: block; width: 100%; height: 100%; }
    .grid { animation: drift 18s linear infinite; transform-origin: center; }
    .current { opacity: 0; animation: reveal 0.7s ease-out forwards; }
    .c1 { animation-delay: .2s; } .c2 { animation-delay: .45s; } .c3 { animation-delay: .7s; }
    .c4 { animation-delay: .95s; } .c5 { animation-delay: 1.2s; }
    .future { opacity: 0; animation: revealFuture .8s ease-out 3.5s forwards; }
    .pulse { animation: pulse 2.4s ease-in-out 3.9s infinite; transform-box: fill-box; transform-origin: center; }
    .main-link { stroke: #49d5cf; stroke-width: 5; stroke-linecap: round; }
    .main-link-green { stroke: #76e28b; stroke-width: 5; stroke-linecap: round; }
    .flow-slow { stroke-dasharray: 8 22; animation: flow 2.6s linear infinite; }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-32px, 18px); } }
    @keyframes reveal { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes revealFuture { from { opacity: 0; transform: translateY(12px); } to { opacity: .98; transform: translateY(0); } }
    @keyframes pulse { 0%, 100% { opacity: .62; } 50% { opacity: 1; } }
    @keyframes flow { to { stroke-dashoffset: -56; } }
    @media (prefers-reduced-motion: reduce) {
      .grid, .current, .future, .pulse, .flow, .flow-slow, .particle { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="stage" aria-label="VaspLoom 科研计算架构动画">
    <svg viewBox="0 0 1920 1080" role="img">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#07111d"/><stop offset=".55" stop-color="#0b1b2b"/><stop offset="1" stop-color="#07121f"/>
        </linearGradient>
        <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#14283b"/><stop offset="1" stop-color="#0d1b2b"/>
        </linearGradient>
        <linearGradient id="futureCard" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#221d3e"/><stop offset="1" stop-color="#16172f"/>
        </linearGradient>
        <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L12,6 L0,12 z" fill="#49d5cf"/>
        </marker>
        <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L12,6 L0,12 z" fill="#76e28b"/>
        </marker>
        <path id="route" d="M 320 350 C 505 350, 525 350, 700 350 S 965 350, 1120 350 S 1390 350, 1585 350"/>
        <path id="futureRoute" d="M 435 760 C 700 710, 850 710, 1040 760 S 1375 810, 1570 760"/>
        <clipPath id="safe"><rect x="40" y="30" width="1840" height="1020" rx="34"/></clipPath>
      </defs>

      <rect width="1920" height="1080" fill="url(#bg)"/>
      <g class="grid" opacity=".28" clip-path="url(#safe)" stroke="#23435b" stroke-width="1">
        <path d="M0 140H1920 M0 230H1920 M0 320H1920 M0 410H1920 M0 500H1920 M0 590H1920 M0 680H1920 M0 770H1920 M0 860H1920 M0 950H1920"/>
        <path d="M100 0V1080 M220 0V1080 M340 0V1080 M460 0V1080 M580 0V1080 M700 0V1080 M820 0V1080 M940 0V1080 M1060 0V1080 M1180 0V1080 M1300 0V1080 M1420 0V1080 M1540 0V1080 M1660 0V1080 M1780 0V1080"/>
      </g>

      <text x="120" y="120" fill="#dff7ff" font-size="48" font-weight="700">VaspLoom 科研计算智能体</text>
      <text x="123" y="166" fill="#78a5bd" font-size="24">安全执行 · 工作流审批 · 作业可追溯</text>
      <line x1="120" y1="205" x2="1800" y2="205" stroke="#1d4057" stroke-width="2"/>

      <g class="current">
        <rect x="120" y="282" width="300" height="136" rx="22" fill="url(#card)" stroke="#49d5cf" stroke-width="3"/>
        <circle cx="160" cy="326" r="12" fill="#49d5cf" filter="url(#glow)"/>
        <text x="190" y="338" fill="#ecffff" font-size="30" font-weight="700">Windows 本地工作台</text>
        <text x="155" y="382" fill="#8db4c5" font-size="22">VaspLoom UI</text>
      </g>

      <g class="current c2">
        <rect x="520" y="282" width="300" height="136" rx="22" fill="url(#card)" stroke="#49d5cf" stroke-width="3"/>
        <circle cx="560" cy="326" r="12" fill="#49d5cf" filter="url(#glow)"/>
        <text x="592" y="338" fill="#ecffff" font-size="30" font-weight="700">受限 Gateway</text>
        <text x="555" y="382" fill="#8db4c5" font-size="22">路径约束 · 哈希校验</text>
      </g>

      <g class="current c3">
        <rect x="920" y="282" width="300" height="136" rx="22" fill="url(#card)" stroke="#49d5cf" stroke-width="3"/>
        <circle cx="960" cy="326" r="12" fill="#49d5cf" filter="url(#glow)"/>
        <text x="992" y="338" fill="#ecffff" font-size="30" font-weight="700">Vlab 中转（默认）</text>
        <text x="955" y="382" fill="#8db4c5" font-size="22">SSH · 临时认证通道</text>
      </g>

      <g class="current c4">
        <rect x="1320" y="282" width="300" height="136" rx="22" fill="url(#card)" stroke="#49d5cf" stroke-width="3"/>
        <circle cx="1360" cy="326" r="12" fill="#49d5cf" filter="url(#glow)"/>
        <text x="1392" y="338" fill="#ecffff" font-size="30" font-weight="700">cl12 / HPC</text>
        <text x="1355" y="382" fill="#8db4c5" font-size="22">Slurm 节点 · 远程目录</text>
      </g>

      <g class="current c5">
        <rect x="1680" y="282" width="120" height="136" rx="22" fill="url(#card)" stroke="#76e28b" stroke-width="3"/>
        <circle cx="1720" cy="326" r="12" fill="#76e28b" filter="url(#glow)"/>
        <text x="1715" y="383" fill="#effff1" font-size="28" font-weight="700">Slurm</text>
      </g>

      <g fill="none">
        <path d="M420 350H520" class="main-link" marker-end="url(#arrowCyan)"/>
        <path d="M820 350H920" class="main-link" marker-end="url(#arrowCyan)"/>
        <path d="M1220 350H1320" class="main-link" marker-end="url(#arrowCyan)"/>
        <path d="M1620 350H1680" class="main-link" marker-end="url(#arrowCyan)"/>
      </g>
      <g fill="#bafcff" filter="url(#glow)">
        <circle cx="0" cy="0" r="7"><animateMotion dur="4.4s" repeatCount="indefinite" begin="0s"><mpath href="#route"/></animateMotion></circle>
        <circle cx="0" cy="0" r="7"><animateMotion dur="4.4s" repeatCount="indefinite" begin="1.1s"><mpath href="#route"/></animateMotion></circle>
        <circle cx="0" cy="0" r="7"><animateMotion dur="4.4s" repeatCount="indefinite" begin="2.2s"><mpath href="#route"/></animateMotion></circle>
        <circle cx="0" cy="0" r="7"><animateMotion dur="4.4s" repeatCount="indefinite" begin="3.3s"><mpath href="#route"/></animateMotion></circle>
      </g>

      <g class="current c5">
        <rect x="1680" y="470" width="120" height="76" rx="18" fill="#12301f" stroke="#76e28b" stroke-width="2"/>
        <text x="1700" y="518" fill="#d9ffe0" font-size="24" font-weight="700">VASP</text>
        <path d="M1740 420V470" class="main-link-green" marker-end="url(#arrowGreen)"/>
      </g>

      <g class="current" opacity=".98">
        <rect x="120" y="510" width="1500" height="110" rx="24" fill="#0b2230" stroke="#2d7180" stroke-width="2"/>
        <text x="155" y="555" fill="#66e8e0" font-size="24" font-weight="700">贯穿能力</text>
        <text x="155" y="592" fill="#d2edf2" font-size="26">审批确认</text>
        <text x="440" y="592" fill="#d2edf2" font-size="26">输入校验</text>
        <text x="725" y="592" fill="#d2edf2" font-size="26">日志诊断</text>
        <text x="1010" y="592" fill="#d2edf2" font-size="26">资源监测</text>
        <text x="1295" y="592" fill="#d2edf2" font-size="26">结果留痕</text>
      </g>

      <g class="future">
        <text x="120" y="715" fill="#c9b8ff" font-size="25" font-weight="700">可选扩展 / 规划</text>
        <text x="120" y="750" fill="#897fb0" font-size="20">按需接入材料解析、错误恢复、工作流与多服务器编排</text>
        <rect x="120" y="790" width="250" height="92" rx="18" fill="url(#futureCard)" stroke="#9a7cff" stroke-width="2" stroke-dasharray="10 8" class="pulse"/>
        <rect x="430" y="790" width="250" height="92" rx="18" fill="url(#futureCard)" stroke="#9a7cff" stroke-width="2" stroke-dasharray="10 8" class="pulse"/>
        <rect x="740" y="790" width="250" height="92" rx="18" fill="url(#futureCard)" stroke="#9a7cff" stroke-width="2" stroke-dasharray="10 8" class="pulse"/>
        <rect x="1050" y="790" width="250" height="92" rx="18" fill="url(#futureCard)" stroke="#9a7cff" stroke-width="2" stroke-dasharray="10 8" class="pulse"/>
        <rect x="1360" y="790" width="250" height="92" rx="18" fill="url(#futureCard)" stroke="#9a7cff" stroke-width="2" stroke-dasharray="10 8" class="pulse"/>
        <text x="185" y="847" fill="#eee9ff" font-size="28" font-weight="700">pymatgen</text>
        <text x="493" y="847" fill="#eee9ff" font-size="28" font-weight="700">custodian</text>
        <text x="807" y="847" fill="#eee9ff" font-size="28" font-weight="700">atomate2</text>
        <text x="1117" y="847" fill="#eee9ff" font-size="28" font-weight="700">DPDispatcher</text>
        <text x="1450" y="847" fill="#eee9ff" font-size="28" font-weight="700">AiiDA</text>
        <path d="M245 790 C430 735, 620 735, 865 790 M555 790 C760 735, 930 735, 1175 790 M865 790 C1080 735, 1290 735, 1485 790" fill="none" stroke="#8d78e8" stroke-width="3" stroke-dasharray="8 12" class="flow-slow"/>
      </g>

      <g transform="translate(1460 965)">
        <rect x="0" y="0" width="22" height="22" rx="6" fill="#49d5cf"/>
        <text x="38" y="19" fill="#a8ced9" font-size="22">当前实现</text>
        <rect x="180" y="0" width="22" height="22" rx="6" fill="none" stroke="#9a7cff" stroke-width="3" stroke-dasharray="6 4"/>
        <text x="218" y="19" fill="#a8ced9" font-size="22">可选扩展</text>
      </g>
    </svg>
  </div>
</body>
</html>
